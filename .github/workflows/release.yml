name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (ex. 1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Signed release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Gradle 8.7
        run: |
          curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          sudo unzip -q -o /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"
          /opt/gradle-8.7/bin/gradle --version

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          yes | "${SDKMANAGER}" --licenses >/dev/null 2>&1 || true
          "${SDKMANAGER}" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # La clé de signature vit uniquement dans les secrets du dépôt.
      # Si aucun secret n'est défini, l'APK est signé avec la clé de debug
      # (toujours installable, mais non destiné au Play Store).
      - name: Restore keystore (if configured)
        if: secrets.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "${KEYSTORE_BASE64}" | base64 -d > ytl-release.jks
          printf 'storeFile=ytl-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${KEYSTORE_PASSWORD}" "${KEY_ALIAS}" "${KEY_PASSWORD}" > keystore.properties

      - name: Assemble release APK
        working-directory: android
        run: gradle --no-daemon assembleRelease --stacktrace

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
          name: YouTube Libre ${{ github.event.inputs.version || github.ref_name }}
          body: |
            APK signé de YouTube Libre.

            Installation :
            `adb install -r app-release.apk`

            L'application ne contient aucune clé API : renseignez la vôtre dans
            Réglages, ou configurez un proxy serveur (server/proxy.mjs).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
