org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Projet à module unique : le parallélisme n'apporte rien et provoquait des
# écritures concurrentes de tâches KSP sur les mêmes sorties.
org.gradle.parallel=false
org.gradle.caching=true

# La configuration cache est désactivée : KSP/Room et AGP 8.5 sont plus
# stables sans elle, et le gain est marginal en intégration continue.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
